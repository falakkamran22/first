    <h1>☕ How to Make a Delicious Coffee ☕</h1>

    <br>

    <h2>Follow These Easy Steps 😊</h2>

    <ol>
        <li>🔥 Boil some water.</li>
        <br>

        <li>☕ Put coffee powder in a cup.</li>
        <br>

        <li>💧 Pour the hot water into the cup.</li>
        <br>

        <li>🥛 Add milk and sugar.</li>
        <br>

        <li>🥄 Stir the coffee well.</li>
        <br>

        <li>😋 Enjoy your delicious coffee!</li>
    </ol>

    <br>

    <h3>✨ Your coffee is ready! Enjoy! ☕❤️</h3>
